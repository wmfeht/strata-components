[workspace]
resolver = "3"
members = [
    "crates/strata-platform",
    "crates/strata-kit",
    "crates/strata-components",
    "crates/strata-gallery",

    # The compositor test harness's peer process (W3): test tooling, never published.
    "crates/strata-platform/tests/support/strata-test-peer",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"

[workspace.dependencies]
# Rune is pre-release and not on crates.io. Every Rune crate pins the same `dev` rev; move
# them together, on purpose (docs/plan.md §0).
# Rune's defaults minus the macOS-only `metal-backend` and `ogg-audio` (MPL-2.0 decoders).
rune = { version = "0.0.1", git = "https://github.com/anomalyco/rune", rev = "5d421fd908ba19b760b93a3dcf821e159ec1d4d7", default-features = false, features = ["accessibility", "dbus", "embedded-fonts", "svg"] }
rune-kit = { version = "0.0.1", git = "https://github.com/anomalyco/rune", rev = "5d421fd908ba19b760b93a3dcf821e159ec1d4d7" }

strata-platform = { version = "0.0.1", path = "crates/strata-platform" }
strata-kit = { version = "0.0.1", path = "crates/strata-kit" }
strata-components = { version = "0.0.1", path = "crates/strata-components" }

# strata-kit theme files (K1); K4's overrides.toml reuses it. `parse` gives spanned tables
# (line numbers) without serde.
toml = { version = "1", default-features = false, features = ["std", "parse"] }

# strata-platform glib-bridge (P9)
futures-channel = "0.3"
gio = { version = "0.22", default-features = false }
glib = { version = "0.22", default-features = false }

# strata-platform settings (P5) and single-instance (P8): the majors Rune's `dbus` feature already
# builds (zbus 6 on tokio). Each dependent line names its own features.
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1", default-features = false }
zbus = { version = "6", default-features = false }
# strata-platform transfer substrate (P0): winit's display through wayland-backend's
# `client_system` (as Rune enables it), and dlsym, pipe2 and poll through libc.
libc = "0.2"
wayland-backend = "0.3"

# PNG goldens: decodes rendered scenes for the tolerance check (gallery dev-dependency only).
png = "0.18"
serde_json = "1"

# strata-platform test harness (W3): the session tests' peer and its client. strata-test-peer is
# test-only and never published; cargo-deny's `wildcards` ban needs its version, so publishing
# strata-platform needs this dev-dependency dropped or deny.toml's `allow-wildcard-paths` (owner
# approval; docs/testing.md).
serde = "1"
strata-test-peer = { version = "0.0.1", path = "crates/strata-platform/tests/support/strata-test-peer" }
wayland-client = "0.31"
wayland-protocols = "0.32"
wayland-protocols-misc = "0.3"
wayland-protocols-wlr = "0.3"
x11rb = "0.13"
xkbcommon = "0.9"

# Regex backend and grammar set chosen in S4 (docs/decisions/S4-syntect-backend.md).
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-onig"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-onig"] }

[profile.dev.package."*"]
debug = false

# Perf tests (`cargo test --profile perf … -- --ignored`), as Rune's own workspace sets it.
[profile.perf]
inherits = "release"
opt-level = 3
codegen-units = 16
lto = false
debug = false
incremental = false

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
unused_unsafe = "deny"

[workspace.lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
dbg_macro = "deny"
missing_safety_doc = "deny"
multiple_unsafe_ops_per_block = "deny"
todo = "warn"
undocumented_unsafe_blocks = "deny"
unimplemented = "warn"
unwrap_used = "warn"

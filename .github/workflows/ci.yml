name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Rune links libwayland-client and libxkbcommon. mesa-vulkan-drivers is lavapipe, the
      # software Vulkan the PNG goldens and scripts render on (docs/testing.md).
      # strata-platform's glib-bridge feature links GLib and GIO (glib-sys, gio-sys).
      # Its media-audio feature links GStreamer and gstreamer-app (gstreamer-sys,
      # gstreamer-app-sys), and its headless sink tests run appsrc, audioconvert, audioresample
      # and volume, from gstreamer1.0-plugins-base.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev libwayland-dev libxkbcommon-dev mesa-vulkan-drivers \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base

      - name: Install the pinned toolchain
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Run the pre-push checks
        run: mise run check

[graph]
all-features = true

[advisories]
ignore = [
  { id = "RUSTSEC-2026-0370", reason = "zbus 5 is required by Rune (accesskit_unix, its dbus feature)" },
  { id = "RUSTSEC-2026-0371", reason = "zbus 5 is required by Rune (accesskit_unix, its dbus feature)" },
  { id = "RUSTSEC-2026-0372", reason = "zbus 5 is required by Rune (accesskit_unix, its dbus feature)" },
  { id = "RUSTSEC-2025-0141", reason = "bincode 1 is syntect's and two-face's syntax dump format; unmaintained, no known vulnerability, and its authors call 1.3.3 complete" },
]

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "simplest-path"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Rune is pinned by git rev until it is on crates.io (docs/plan.md §8).
allow-git = ["https://github.com/anomalyco/rune"]

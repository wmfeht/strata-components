[workspace]
resolver = "3"
members = [
    "crates/strata-platform",
    "crates/strata-kit",
    "crates/strata-components",
    "crates/strata-gallery",

    # The compositor test harness's peer process (W3): test tooling, never published.
    "crates/strata-platform/tests/support/strata-test-peer",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"

[workspace.dependencies]
# Rune is pre-release and not on crates.io. Every Rune crate pins the same `dev` rev; move
# them together, on purpose (docs/plan.md §0).
# Rune's defaults minus the macOS-only `metal-backend` and `ogg-audio` (MPL-2.0 decoders).
rune = { version = "0.0.1", git = "https://github.com/anomalyco/rune", rev = "78d22ed8eef60d76ac3f322ffc5883f3fcbc57f5", default-features = false, features = ["accessibility", "dbus", "embedded-fonts", "svg"] }
rune-kit = { version = "0.0.1", git = "https://github.com/anomalyco/rune", rev = "78d22ed8eef60d76ac3f322ffc5883f3fcbc57f5" }

strata-platform = { version = "0.0.1", path = "crates/strata-platform" }
strata-kit = { version = "0.0.1", path = "crates/strata-kit" }
strata-components = { version = "0.0.1", path = "crates/strata-components" }
# Test-only and never published (strata-platform's dev-dependency). cargo-deny's `wildcards`
# ban needs the version; publishing strata-platform must drop this dev-dependency first.
strata-test-peer = { version = "0.0.1", path = "crates/strata-platform/tests/support/strata-test-peer" }

# strata-platform glib-bridge (P9)
futures-channel = "0.3"
gio = { version = "0.22", default-features = false }
glib = { version = "0.22", default-features = false }

# PNG goldens: decodes rendered scenes for the tolerance check (gallery dev-dependency only).
png = "0.18"
serde = "1"
serde_json = "1"
wayland-client = "0.31"
wayland-protocols = "0.32"
wayland-protocols-misc = "0.3"
wayland-protocols-wlr = "0.3"
x11rb = "0.13"
xkbcommon = "0.9"

[profile.dev.package."*"]
debug = false

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
unused_unsafe = "deny"

[workspace.lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
dbg_macro = "deny"
missing_safety_doc = "deny"
multiple_unsafe_ops_per_block = "deny"
todo = "warn"
undocumented_unsafe_blocks = "deny"
unimplemented = "warn"
unwrap_used = "warn"

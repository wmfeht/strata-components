[files]
extend-exclude = [
  "Cargo.lock",
  "target/**",
  "tests/golden/**/*.png",
  # C20d's bundled emoji: CLDR's names and keywords ("Claus", "hashi"), generated, not prose.
  "crates/strata-components/src/controls/icon_picker/emoji/emoji.tsv",
]

[default.extend-words]
Omarchy = "Omarchy"
Hyprland = "Hyprland"
Strata = "Strata"
# A bundled theme's name (crates/strata-kit/themes/catalog.toml), not a misspelt Dracula.
darcula = "darcula"
Darcula = "Darcula"

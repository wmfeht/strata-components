name: Platform

# strata-platform's compositor and D-Bus tests (W3): `mise run test-platform`, each test in its
# own headless sway, Xwayland and session bus. No GPU: sway composites with pixman and Rune
# renders on lavapipe (crates/strata-platform/tests/support/gpu.rs).
#
# Ubuntu 26.04 (libwayland 1.24, sway 1.11), not 24.04: P0's transfer substrate reaches winit's
# Wayland display through `wl_proxy_get_display`, which libwayland 1.23 added. On 24.04's 1.22
# its tests that need that display could only check that it is reported Unsupported
# (crates/strata-platform/tests/session/p0.rs).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/strata-platform/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/platform.yml"
  pull_request:
    paths:
      - "crates/strata-platform/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/platform.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sessions:
    name: Compositor and D-Bus tests
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      # Software rendering and four vCPUs: waits get three times as long, and two sessions run
      # at once.
      STRATA_TEST_TIMEOUT_SCALE: "3"
      RUST_TEST_THREADS: "2"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The list lives beside the harness, so a work package adds a package without editing
      # this workflow.
      - name: Install sway, Xwayland, D-Bus and lavapipe
        run: |
          sudo apt-get update
          grep -v '^[[:space:]]*\(#\|$\)' crates/strata-platform/tests/support/packages.txt \
            | xargs sudo apt-get install -y --no-install-recommends

      - name: Install the pinned toolchain
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: platform

      - name: Run the session tests
        run: mise run test-platform

      - name: Keep the session logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: session-logs
          path: target/tmp/session/
          if-no-files-found: ignore
          retention-days: 14
